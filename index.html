<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psychometric Practice</title><style>body{font-family:system-ui,Arial;background:#f3f5f9;color:#17243a;margin:0}main{max-width:850px;margin:30px auto;padding:20px}.panel{background:white;border-radius:15px;padding:25px;margin:15px 0;box-shadow:0 2px 12px #17243a12}button{padding:12px 18px;border:0;border-radius:9px;background:#1e4b84;color:white;cursor:pointer;margin:5px}button.secondary{background:#e6ecf4;color:#17243a}button:disabled{opacity:.4}.choice{display:block;width:100%;text-align:left;background:#eaf0f8;color:#17243a;margin:8px 0}.choice.selected{background:#c9dff9;outline:2px solid #1e4b84}.muted{color:#59677c}.bar{background:#e7ebf0;height:12px;border-radius:12px;overflow:hidden}.fill{height:100%;background:#3569a5}#timer{font-size:2rem;font-weight:800}#timer.urgent{color:#c12c2c}h1{font-size:1.8rem}#review article{padding:12px;border-bottom:1px solid #ddd}canvas{width:100%;max-height:300px}</style></head><body><main><h1>Corrections Victoria – Psychometric Practice</h1><p class="muted">Independent CCAT-style practice · Not affiliated with Corrections Victoria or Criteria Corp.</p><section id="app" class="panel"></section></main><script>
const Q=[
['Numerical','What is 18% of 250?',['35','40','45','50'],2,'10% is 25 and 8% is 20, so 45.'],
['Number patterns','4, 9, 16, 25, ?',['30','34','36','49'],2,'Consecutive square numbers: 2², 3², 4², 5², 6².'],
['Verbal','Which word is closest to prudent?',['Cautious','Reckless','Hasty','Indifferent'],0,'Prudent means cautious and sensible.'],
['Logical','All inspectors are trained. Some officers are inspectors. What must be true?',['All officers are inspectors','Some officers are trained','All trained people are inspectors','No officers lack training'],1,'The officers who are inspectors are trained.'],
['Spatial','▲ ▶ ▼ ◀ ▲ ?',['▼','◀','▶','▲'],2,'Each arrow rotates 90 degrees clockwise.'],
['Numerical','288 km in 4.5 hours: average speed?',['60','62','64','68'],2,'288 ÷ 4.5 = 64 km/h.'],
['Number patterns','3, 7, 15, 31, ?',['47','61','63','65'],2,'Multiply by 2 and add 1.'],
['Verbal','Opposite of scarce?',['Rare','Limited','Abundant','Insufficient'],2,'Abundant means plentiful.'],
['Numerical','From 7:45 am to 10:20 am is how long?',['2 h 25 m','2 h 35 m','2 h 45 m','3 h 5 m'],1,'The elapsed time is 2 hours 35 minutes.'],
['Logical','Ella finishes before Finn. Grace finishes after Finn. Who finishes last?',['Ella','Finn','Grace','Cannot tell'],2,'Ella, then Finn, then Grace.'],
['Numerical','A $160 item is discounted 25%. New price?',['$100','$115','$120','$125'],2,'25% of $160 is $40; subtract to get $120.'],
['Spatial','○ ◐ ● ○ ◐ ● ○ ?',['●','○','◐','◑'],2,'The three-symbol pattern repeats.'],
['Number patterns','81, 27, 9, 3, ?',['0','1','2','3'],1,'Divide by 3 each step.'],
['Verbal','The report contained only verified facts. It was _____.',['Speculative','Factual','Ambiguous','Exaggerated'],1,'Factual means based on facts.'],
['Numerical','Five workers produce 40 units in 2 hours. Units per worker per hour?',['2','3','4','5'],2,'40 ÷ (5 × 2) = 4.'],
['Logical','Every red tag is numbered. Tag 42 is numbered. Must it be red?',['Yes','No','Only if new','Only if inspected'],1,'Other colours could also be numbered.'],
['Number patterns','2, 6, 12, 20, 30, ?',['40','41','42','44'],2,'Differences are 4, 6, 8, 10, then 12.'],
['Numerical','What is 3/8 of 240?',['80','85','90','95'],2,'240 ÷ 8 × 3 = 90.'],
['Spatial','↗ rotated 90° clockwise points where?',['Northwest','Southeast','Southwest','Northeast'],1,'Northeast rotates to southeast.'],
['Verbal','Closest meaning to mitigate?',['Intensify','Reduce','Ignore','Predict'],1,'Mitigate means reduce severity.'],
['Numerical','360 items, 35% sent away. How many remain?',['216','224','234','252'],2,'65% of 360 = 234.'],
['Number patterns','5, 8, 14, 23, 35, ?',['47','48','50','53'],2,'Differences rise 3, 6, 9, 12, 15.'],
['Logical','Some A are B; all B are C. What must follow?',['All A are C','Some A are C','No A are C','All C are A'],1,'Those A that are B must be C.'],
['Numerical','234 km on 18 L: kilometres per litre?',['11','12','13','14'],2,'234 ÷ 18 = 13.'],
['Verbal','Opposite of transient?',['Brief','Temporary','Permanent','Fleeting'],2,'Transient means temporary.'],
['Spatial','A square rotated 45° has how many sides?',['3','4','5','8'],1,'Rotation preserves four sides.'],
['Numerical','Price rises from $80 to $100. Percentage increase?',['20%','25%','30%','40%'],1,'20 ÷ 80 × 100 = 25%.'],
['Number patterns','1, 2, 6, 24, 120, ?',['240','360','600','720'],3,'Multiply by 2, 3, 4, 5, then 6.'],
['Logical','Amy before Ben, Ben before Cara, Dan after Cara. Who is second?',['Amy','Ben','Cara','Dan'],1,'Amy, Ben, Cara, Dan.'],
['Verbal','Choose the correct spelling.',['Accomodation','Acommodation','Accommodation','Accommadation'],2,'Accommodation has double c and double m.'],
['Numerical','A 450 L tank is 60% full. How many litres to fill it?',['180','200','250','270'],0,'40% of 450 L is 180 L.'],
['Spatial','◆ ◇ ◇ ◆ ◇ ◇ ◆ ?',['◆','◇','●','□'],1,'One filled diamond followed by two hollow diamonds.'],
['Number patterns','10, 13, 19, 28, 40, ?',['52','53','55','58'],2,'Differences are 3, 6, 9, 12, 15.'],
['Numerical','Area of a 12 m × 7 m rectangle?',['38 m²','74 m²','84 m²','96 m²'],2,'12 × 7 = 84 square metres.'],
['Logical','No electric vehicles use diesel. Van A uses diesel. What must be true?',['Van A is electric','Van A is not electric','Van A uses petrol','Van A is hybrid'],1,'Diesel use excludes Van A from the defined electric group.'],
['Verbal','Closest meaning to impartial?',['Biased','Fair','Harsh','Uncertain'],1,'Impartial means fair and unbiased.'],
['Numerical','72 tasks in 6 hours; how many in 9 hours at same rate?',['96','102','108','120'],2,'12 per hour × 9 = 108.'],
['Number patterns','2, 9, 4, 18, 6, 27, ?',['8','9','12','36'],0,'Odd positions are 2, 4, 6, 8.'],
['Spatial','→ reflected in a vertical mirror points where?',['Up','Down','Left','Right'],2,'A vertical reflection reverses horizontal direction.'],
['Verbal','Instructions were _____, leaving no uncertainty.',['Vague','Explicit','Ambiguous','Incomplete'],1,'Explicit means clear and direct.'],
['Numerical','What is 15% of 360?',['45','50','54','60'],2,'10% is 36; 5% is 18; total 54.'],
['Logical','If P implies Q, and Q is false, what follows?',['P true','P false','P unknown','Q true'],1,'If P were true, Q would have to be true.'],
['Number patterns','100, 95, 85, 70, 50, ?',['20','25','30','35'],1,'Subtract 5, 10, 15, 20, then 25.'],
['Numerical','$240 includes 20% tax on pre-tax price. Pre-tax price?',['$192','$200','$210','$220'],1,'240 ÷ 1.2 = 200.'],
['Verbal','Closest meaning to concur?',['Disagree','Agree','Delay','Question'],1,'Concur means agree.'],
['Spatial','Which shape has most sides?',['Pentagon','Hexagon','Heptagon','Octagon'],3,'An octagon has eight sides.'],
['Numerical','150 km at 60 km/h takes how long?',['2 h','2.25 h','2.5 h','3 h'],2,'150 ÷ 60 = 2.5 hours.'],
['Number patterns','4, 12, 9, 27, 24, 72, ?',['69','70','75','216'],0,'Alternate ×3 and −3.'],
['Logical','All D are E. No E are F. What must be true?',['Some D are F','No D are F','All F are D','Some E are D'],1,'D is within E, and E excludes F.'],
['Numerical','Three boxes contain 48, 67 and 85 items. Total?',['190','195','200','205'],2,'48 + 67 + 85 = 200.']
];
const KEY='cv-psychometric-results-v1';let state={index:0,answers:{},deadline:0,questionDeadline:0,tick:null,done:false};const app=document.getElementById('app');const el=(tag,attrs={},content='')=>{const e=document.createElement(tag);Object.assign(e,attrs);e.textContent=content;return e};function records(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}function save(r){localStorage.setItem(KEY,JSON.stringify([...records(),r]))}function start(){clearInterval(state.tick);state={index:0,answers:{},deadline:Date.now()+900000,questionDeadline:Date.now()+18000,tick:null,done:false};renderQuestion();state.tick=setInterval(tick,100)}function remaining(){return Math.max(0,Math.ceil((Math.min(state.deadline,state.questionDeadline)-Date.now())/1000))}function tick(){if(state.done)return;let global=state.deadline-Date.now();if(global<=0){finish();return}if(state.questionDeadline-Date.now()<=0){advance();return}const t=document.getElementById('timer');if(t){t.textContent=remaining()+'s';t.classList.toggle('urgent',remaining()<=5)}const g=document.getElementById('global');if(g)g.textContent='Total remaining: '+Math.ceil(global/1000)+'s'}function advance(){if(state.index>=49){finish();return}state.index++;state.questionDeadline=Math.min(state.deadline,Date.now()+18000);renderQuestion()}function renderQuestion(){app.replaceChildren();let q=Q[state.index];app.append(el('p',{className:'muted'},`Question ${state.index+1} of 50 · ${q[0]}`));const bar=el('div',{className:'bar'});const fill=el('div',{className:'fill'});fill.style.width=((state.index+1)*2)+'%';bar.append(fill);app.append(bar);const timer=el('div',{id:'timer'},remaining()+'s');app.append(timer,el('p',{id:'global',className:'muted'},''),el('h2',{},q[1]));q[2].forEach((o,j)=>{let b=el('button',{className:'choice'+(state.answers[state.index]===j?' selected':'')},String.fromCharCode(65+j)+'. '+o);b.onclick=()=>{state.answers[state.index]=j;renderQuestion()};app.append(b)});let next=el('button',{},state.index===49?'Finish test':'Next / Skip');next.onclick=advance;let finishBtn=el('button',{className:'secondary'},'Finish now');finishBtn.onclick=finish;app.append(next,finishBtn);tick()}function finish(){if(state.done)return;state.done=true;clearInterval(state.tick);const score=Q.reduce((n,q,i)=>n+(state.answers[i]===q[3]?1:0),0);const byCat={};Q.forEach((q,i)=>{byCat[q[0]]??={correct:0,total:0};byCat[q[0]].total++;if(state.answers[i]===q[3])byCat[q[0]].correct++});const result={date:new Date().toISOString(),score,total:50,attempted:Object.keys(state.answers).length,byCat};save(result);results(result)}function results(r){app.replaceChildren(el('h2',{},`Result: ${r.score}/50 (${r.score*2}%)`),el('p',{className:'muted'},`Attempted ${r.attempted} of 50 questions`));const heading=el('h3',{},'Category breakdown');app.append(heading);Object.entries(r.byCat).forEach(([c,s])=>app.append(el('p',{},`${c}: ${s.correct}/${s.total}`)));app.append(el('h3',{},'Your progress'));const history=records();const canvas=el('canvas',{width:750,height:250});app.append(canvas);const ctx=canvas.getContext('2d');ctx.clearRect(0,0,750,250);ctx.strokeStyle='#3569a5';ctx.lineWidth=3;ctx.beginPath();history.forEach((x,i)=>{const px=30+i*(690/Math.max(1,history.length-1)),py=220-x.score/x.total*190;i?ctx.lineTo(px,py):ctx.moveTo(px,py)});ctx.stroke();history.forEach((x,i)=>{const px=30+i*(690/Math.max(1,history.length-1)),py=220-x.score/x.total*190;ctx.fillStyle='#1e4b84';ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill();ctx.fillText(`${x.score}/${x.total}`,Math.min(px,680),Math.max(py-10,12))});app.append(el('h3',{},'Review answers'));Q.forEach((q,i)=>{const a=el('article');a.append(el('strong',{},`${i+1}. ${q[1]}`),el('p',{},'Your answer: '+(state.answers[i]===undefined?'Skipped':q[2][state.answers[i]])),el('p',{},'Correct: '+q[2][q[3]]),el('p',{className:'muted'},q[4]));app.append(a)});const restart=el('button',{},'Take test again');restart.onclick=start;app.append(restart)}function home(){app.replaceChildren(el('h2',{},'50 questions · 15 minutes'),el('p',{},'Each question has an 18-second countdown. When time expires, the next question appears automatically. Unanswered questions count as incorrect.'),el('p',{className:'muted'},'No calculator. Scores are saved only in this browser. This is an unofficial practice test, not an official CCAT percentile assessment.'));let b=el('button',{},'Start timed test');b.onclick=start;app.append(b);const h=records();if(h.length)app.append(el('p',{className:'muted'},`Saved full-length attempts: ${h.length}. Most recent: ${h.at(-1).score}/50.`))}home();
</script></body></html>
